<!DOCTYPE html5>
<html>
    <!--The Title Displayed in Browser Window-->
    <title>Super Hero Code Clash</title>

    <!--The header of the page-->
    <head>Super Hero Code Clash</head><br>

    <!--The body of the page describing whats happening-->
    <b>Select two Super Heros and watch as Gemma generates a story of their epic</b><br>


   <!-- Table for hero selection -->
<table>
    
    <!-- The Title of the table -->
    <thead>
        <tr>
            <!-- colspan="2" makes this single title cell stretch across both columns -->
            <th colspan="2">Select Your Heroes</th>
        </tr>
    </thead>
    
    <!-- Table Body Section: Contains the interactive selection fields -->
    <tbody>
        <!--Row 1: Used to select Heros-->
        <tr>
            
            <!-- Column 1: Selection area for the first hero -->
            <td>
                <!--Identifier for the Column-->
                <label for="hero1">Hero 1</label>
                <!-- Search input field7 -->
                <input type="search" id="hero1" placeholder="Search Hero 1">
            </td>
            
            <!-- Column 2: Selection area for the second hero -->
            <td>
                <label for="hero2">Hero 2</label>
                <input type="search" id="hero2" placeholder="Search Hero 2">
            </td>
            
        </tr>

        <!--Row 2: Used to show Hero Pictures-->
        <tr>
            <td>
                <img id="figterPic1" src="{{ url_for('static', filename='images/awaitingfighter.jpg') }}" alt="Awaiting Fighter 1" width="100" height="100">
            </td>
            <td>
                <img id="fighterPic2" src="{{ url_for('static', filename='images/awaitingfighter.jpg') }}" alt="Awaiting Fighter 1" width="100" height="100">
            </td>
        </tr>

        
        
        <!--Row 3; Used to display hero stats-->
        <tr>
            <td>
                <b>
                    Nothing to show yet....
                </b>    
            </td>
            <td>
                <b>
                    Nothing to show yet...
                </b>
            </td>
            
        </tr>

        <!--Row 4: Used to hold the Battle Button-->
        <tr>
            <td>
                <button>Simulate Fight!</button>
            </td>
        </tr>

        <!--Row 5: Holds the details of the battle-->
        <tr>
            <td>
                <b>
                    No fight has begun
                </b>
            </td>
        </tr>
        

    </tbody>
    
</table>




</html>
